<div class="ph-lb" id="ph-lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="ph-lb-top">
    <span class="ph-lb-count" aria-live="polite"></span>
    <button type="button" class="ph-lb-btn ph-lb-close" aria-label="Close (Esc)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <button type="button" class="ph-lb-btn ph-lb-prev" aria-label="Previous photo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <figure class="ph-lb-figure">
    <img class="ph-lb-img" alt="">
    <figcaption class="ph-lb-cap"></figcaption>
  </figure>
  <button type="button" class="ph-lb-btn ph-lb-next" aria-label="Next photo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>
