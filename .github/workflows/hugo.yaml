# Builds the Hugo site (including the photography section) and deploys it to GitHub Pages.
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Run it manually from the Actions tab after adding photos to Google Drive
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      # ---- Photography: Google Drive -> static/photos + data/photography.json ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: photography/requirements.txt
      - name: Install photo tools
        run: |
          sudo apt-get install -y -q --no-install-recommends libimage-exiftool-perl \
            || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libimage-exiftool-perl)
          pip install -r photography/requirements.txt
      - name: Restore processed photos
        uses: actions/cache/restore@v4
        with:
          path: |
            static/photos
            data/photography.json
            .photo-cache
          key: photos-${{ github.run_id }}
          restore-keys: photos-
      - name: Build photos from Google Drive
        id: photos
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          # fingerprint of the processed photos (the files don't exist yet on a first run)
          state() { { cat .photo-cache/manifest.json data/photography.json 2>/dev/null || true; } | sha256sum | cut -c1-16; }
          before=$(state)
          python photography/build.py --ci
          after=$(state)
          echo "key=photos-$after" >> "$GITHUB_OUTPUT"
          if [[ "$before" != "$after" && -f .photo-cache/manifest.json ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save processed photos
        if: steps.photos.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            static/photos
            data/photography.json
            .photo-cache
          key: ${{ steps.photos.outputs.key }}
      # ----------------------------------------------------------------------------

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5