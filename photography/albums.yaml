# Album titles, descriptions and covers.
# Edit this file, then commit and push: the site rebuilds in a few minutes (no photos are re-processed).
#
# Each entry is an album's folder in Google Drive: Country/Place/Year.
# Leave out the year (Country/Place) to match that place in any year.
# The country can be written in English or Portuguese ("Spain" = "Espanha").
# Every field is optional. Leave it empty ("") to use the default.
#
#   title:        name on the album card and page        (default: the place folder name)
#   description:  text under the title on the album page (Markdown allowed: **bold**, *italic*, [link](url))
#   cover:        file name of the photo for the album card, e.g. DSCF0412.JPG (default: first photo)
#   trip:         false = not a trip, left out of the timeline (home towns are already excluded,
#                 see home_places in trips.yaml)
#
# Less common: location, hide_on_map and per-photo fixes (photos:), see photography/README.md.
# For a new album, copy a block and change the folder.

