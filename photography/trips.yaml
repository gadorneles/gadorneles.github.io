# Photography section settings.
#
# Photos live in Google Drive:  Photography/<Country>/<Place>/<Year>/photo.jpg
# Each Place/Year folder becomes one album, e.g. Brasil/João Pessoa/2026 -> /photography/joao-pessoa-2026/
# (Country/Year without a place also works: Japan/2025 -> "Japan 2025")
# GitHub Actions reads the folder and rebuilds the site (see photography/README.md).

settings:
  drive_folder_id: "1ppxqZcS4iBPSeWfXtaf0PtbIukg61pri"            # ID of the "Photography" folder: drive.google.com/drive/folders/<THIS PART>
  max_size: 2048                 # long edge of published images (px)
  quality: 82                    # WebP quality
  coord_decimals: 3              # rounding of published coordinates (3 = ~100 m, 2 = ~1 km)
  home_places:                   # albums at these places are not trips: left out of the timeline
    - Rio Grande
  place_aliases:                 # fold suburbs/wards into the city name used in stats
    # Urayasu: Tokyo
    # Aoba-ku: Sendai

# Album titles, descriptions and covers live in photography/albums.yaml (easiest to edit).
# The list below is the older way to set the same options and still works;
# albums.yaml wins if both set something.
trips:
  # - folder: Brasil/João Pessoa/2026
  #   title: João Pessoa               # default: the place folder name
  #   description: Summer in the Northeast.   # Markdown allowed
  #   cover: DSCF1234.jpg              # default: first photo
  #   location: João Pessoa            # where photos without GPS go (default: the place folder name)
  #   hide_on_map: false               # true: no photo pins for this album (e.g. home town)
  #   photos:                          # per-photo fixes, keyed by file name
  #     DSCF1250.jpg: {location: {lat: 34.9671, lon: 135.7727}, place: Fushimi Inari}
  #     DSCF1260.jpg: {caption: Rain on Pontocho}
  #     DSCF1301.jpg: {hidden: true}
